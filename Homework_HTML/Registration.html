<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(200, 150, 247);">
       <center> <h1>Registration Form</h1></center>
    <form action="Login.html">
       <center> <table border="2px">
            <tr>
                <td>Name</td>
                <td><input type="text" pattern="[A-Z][a-z]+"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td>Phone</td>
                <td><input type="number" max="10"></td>
            </tr>
            <tr>
                <td>Address</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Username</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                
                <td><input type="submit"></td>
            </tr>
        </table>
        </center>
    </form>

</body>
</html>
