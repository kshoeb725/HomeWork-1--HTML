<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: linear-gradient(120deg , rgb(204, 78, 99), rgb(241, 69, 69), rgb(103, 103, 234), rgb(75, 229, 75), rgb(238, 238, 106));

            background-size: 500% 500%;

            animation: gd 10s ease  infinite ;
           margin: 0;
           padding: 25px;
           

        }
         @keyframes  gd{
                0%,100%{
                background-position:0% 50%;
            }
            50%{
                background-position:100%;
            }
    }
    table{
        
       width: 100%;
        padding: 20px;
        border-collapse: collapse;
    }
    .container{
         box-shadow: 10px 10px 20px blue;
        margin: auto;
        max-width: 1000px;
        padding: 30px;
    }
    td{
        padding: 15px;
        text-align: center;
    }
    tr:nth-child(even){
        background-color: rgb(18, 222, 161);
    }
    td::before{
        content: "😎";
    }
    table:hover{
        cursor: pointer;
    }
    td:hover{
        font-size: xx-large;
        font-style: italic;
        color: chartreuse;
        text-decoration: underline dotted;
        transition: transform 2s ease;
        /* transform: rotateX(120deg); */
        /* transform: scale(0.5); */
        /* transform: rotateZ(360deg); */
        transform: skew(50deg);
    }
    </style>
</head>
<body>
    <div class="container">
