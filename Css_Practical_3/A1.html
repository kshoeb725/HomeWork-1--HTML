<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
            padding: 0px;
        }
        .box1{
            height: 70px;
            width: 70px;
            padding: 20px;
            margin:10px
        }
        .container1{
           display: flex;
           flex-direction: row; 
        }
        .container2{
           display: flex;
           justify-content: space-between;
        }
    </style>
</head>
<body>
    <h1>Flex-direction-row</h1>
    <div class="container1" style="background-color: grey">
    <div class="box1" style="background-color: aqua;">box1</div>
    <div class="box1" style="background-color: red;">box2</div>
    <div class="box1" style="background-color: blue;">box3</div>
    <div class="box1" style="background-color: green;">box4</div>
    </div>
     <h1>Flex-Justify-Content-space_between</h1>
    <div class="container2" style="background-color: grey">
    <div class="box1" style="background-color: aqua;">box1</div>
    <div class="box1" style="background-color: red;">box2</div>
    <div class="box1" style="background-color: blue;">box3</div>
    <div class="box1" style="background-color: green;">box4</div>
    </div>
</body>
</html>
