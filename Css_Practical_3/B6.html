<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
            padding: 0px;
            background-color: aqua;
        }
        .box1{
            height: 70px;
            width: 70px;
            padding: 2px;
            margin:10px
        }
        
        .container1{
           display: flex;
           flex-direction: row; 
        }
        
        @media(min-width:600px){
            .container1{
           display: flex;
           flex-direction: column;
           
        }
        body{
            margin: 0px;
            padding: 0px;
            background-color: blue; 
        }
        .box1{
            height: 70px;
            width: 100px;
            padding: 2px;
            margin:10px
            
        }
        h1{
            font-size: 50px;
        }
        }
        
    </style>
</head>
<body>
    <h1>Flex-direction</h1>
    <div class="container1" style="background-color: grey">
    <div class="box1" style="background-color: aqua;">box1</div>
    <div class="box1" style="background-color: red;">box2</div>
    <div class="box1" style="background-color: blue;">box3</div>
    <div class="box1" style="background-color: green;">box4</div>
    </div>
    
</body>
</html>
