<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: linear-gradient(120deg, rgb(227, 75, 75),rgb(102, 214, 102),rgb(243, 243, 151),rgb(122, 122, 234));
            background-size: 500% 500%;
            animation: gd 10s ease  infinite;
        }
        @keyframes gd{
            0%, 100%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100%;
            }
        }
        .container{
           
            margin:auto;
            width: 100px;
            border-radius: 50px;
            margin-top: 100px;
            

        }

        table{
            box-shadow: 10px 10px 5px rgb(238, 57, 8);
            margin-top: 100px;
            max-width: 1000%;
            text-align: center;
            padding: 20px;
            width: 100%;
            
            border-collapse: collapse;
            background: linear-gradient(120deg, rgb(57, 194, 16),rgb(224, 138, 17),rgb(243, 243, 151),rgb(122, 122, 234));
            background-size: 500% 500%;
            animation: dd 10s ease  infinite;
            


        }
         @keyframes dd{
            0%, 100%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100%;
            }
        }

        tr:nth-child(even){
            background-color: blue;
        }
        td:hover{
            font-size: large;
            
            text-decoration: underline wavy;
            transition: transform 2s ease;
            /* transform: rotate(120deg); */
            /* transform: rotateY('120deg'); */
            /* transform: rotateZ(360deg); */
            /* transform: scale(250%); */
            /* transform: skew(120deg); */
            transform: perspective(70px) rotateX(120deg);
            

            cursor: pointer;
        }
        td{
            padding: 20px;
        }
        td::before{
            content: "😎";
        }
        

    </style>
</head>
<body>
    <div>
        
        <table class="container">
            <tr>
                <td>Id</td>
                <td>Name</td>
                <td>Salary</td>
                <td>Address</td>
            </tr>
            <tr>
                <td>101</td>
                <td>Shoeb</td>
                <td>60,000</td>
                <td>Mumbai</td>
            </tr>
            <tr>
                <td>101</td>
                <td>Shoeb</td>
                <td>60,000</td>
                <td>Mumbai</td>
            </tr>

            <tr>
                <td>101</td>
                <td>Shoeb</td>
                <td>60,000</td>
                <td>Mumbai</td>
            </tr>
            <tr>
                <td>101</td>
                <td>Shoeb</td>
                <td>60,000</td>
                <td>Mumbai</td>
            </tr>
        </table>
    </div>
</body>
</html>
