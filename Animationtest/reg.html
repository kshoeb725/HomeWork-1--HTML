<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: linear-gradient(120deg, rgb(72, 222, 224),rgb(188, 208, 34),rgb(243, 243, 151),rgb(249, 44, 188));
            background-size: 500% 500%;
            animation: gd 10s ease  infinite;
        }
        @keyframes gd{
            0%, 100%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100%;
            }
        }
        .container{
           
           width: 200px;
            margin: auto;

        }

        table{
            box-shadow: 10px 10px 5px rgb(59, 233, 36);
            margin-top: 100px;
            max-width: 1000%;
            text-align: center;
            padding: 20px;  
            width: 100%;
            border: 2px solid;
            border-collapse: collapse;


        }

        tr:nth-child(even){
            background-color: blue;
        }
        td:hover{
            font-size: large;
            
            text-decoration: underline wavy;
            
            
            
            cursor: pointer;
        }
        td{
            padding: 20px;
        }
        
        

    </style>
</head>
<body>
        <center> <h1>Registration Form</h1></table></center>
    <div>
        <form action="table.html">
        <table class="container">
           

          
            <tr>
                <td>Name</td>
                <td><input type="text" name="" id="" pattern="[A-Z][a-z]+"></td>
                
            </tr>
             <tr>
                <td>Email</td>
                <td><input type="email" name="" id="" ></td>
                
            </tr>
             <tr>
                <td>Phone number</td>
                <td><input type="number" name="" id=""></td>
                
            </tr>
             <tr>
                <td>Address</td>
                <td><input type="text" name="" id=""></td>
                
            </tr>
             <tr>
                
                <center><td><input type="submit" name="" id=""></td>
                <td><input type="reset" name="" id=""></td></tr><center>
            </tr>
        </table>
        </form>
    </div>
</body>
</html>
